[project]
name = "t-mkkl-payment-processing"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "faststream[rabbit]>=0.6.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "uvicorn-worker>=0.4.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.11",
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "*/.venv/*",
]

[tool.ruff]
src = ["app"]
line-length = 120
output-format = "concise"

[tool.ruff.lint]
select = [
    "E", # pycodestyle – ошибки стиля
    "W", # pycodestyle – ошибки стиля
    "F", # pyflakes – ошибки синтаксиса
    "B", # flake8-bugbear – потенциальные баги
    "SIM", # flake8-simplify – упрощение кода
    "UP", # pyupgrade – современный синтаксис
    "I", # isort – сортировка импортов
    "S",
    "ANN",
    "ASYNC",
    "FAST",
    "COM",
    "T20",
]

ignore = [
    'B008', #  function-call-in-default-argument
    'ANN401',
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
